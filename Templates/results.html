<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>End Scores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>
<body>
<div class="container text-center mt-5"> Twoje cechy to:</div>
<div class="container my-5">
    <div class="row g-4">
        <!-- Kafelek 1 -->
        <div class="col-md-6">
            <p class="mt-4">Neurotyczność </p>
            <div id="neuroticism" >
                <div class="fs-2 text-warning">
                    {{neuroticism|safe}}
                </div>
            </div>

        </div>
        <div class="col-md-6">
            <p>Otwartość</p>
            <div id="opennes" >
                <div class="fs-2 text-warning">
                    {{opennes|safe}}
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <p>Ugodowość</p>
            <div id="agree" >
                <div class="fs-2 text-warning">
                    {{agree|safe}}
                </div>
            </div>
        </div>

    </div>
    <div class="row g-4">

        <div class="col-md-6">
            <p>Sumienność</p>
            <div id="conciousnes">
                <div class="fs-2 text-warning">
                    {{conciousnes|safe}}
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <p>Ekstrowersja</p>
            <div id="extraversion" data-value="{{extraversion}}">
                <div class="fs-2 text-warning">
                    {{extraversion|safe}}
                </div>
            </div>
        </div>
    </div>
</div>




<a href="{{ url_for('home') }}">Powrót</a>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
